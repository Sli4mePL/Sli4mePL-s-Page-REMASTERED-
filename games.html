<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background-image: url(Img/tlo1.png); 
            background-size: cover; background-position: center; background-attachment: fixed;
            background-color: rgba(0, 0, 0, 0.8); background-blend-mode: overlay;
            color: white; min-height: 100vh; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            overflow: hidden;
        }
        h1 { color: #a82eff; font-size: 4rem; margin-bottom: 20px; }
        p { font-size: 1.3rem; margin-bottom: 30px; }
        .buttons-container { display: flex; gap: 20px; }
        .btn { padding: 15px 35px; font-size: 1.1rem; font-weight: bold; color: black; text-decoration: none; background-color: #a82eff; border-radius: 12px; transition: all 0.3s ease; }
        .btn:hover { transform: translateY(-7px); background-color: #bc61ff; }
        .btn-action { background-color: #00d2ff; box-shadow: 0 8px 20px rgba(0, 210, 255, 0.4); } /* Inny kolor dla linku zewnetrznego */
        .btn-action:hover { background-color: #3ae0ff; }
    </style>
</head>
<body>
    <h1>My Games</h1>
    <p>Check My Games!</p>
    <div class="buttons-container">
        <!-- Zmień href na stronę, do której ma prowadzić -->
        <a href="" target="_blank" class="btn btn-action">Nothing Here!... :[ </a>
        <a href="index.html" class="btn">Back </a>
    </div>
</body>
</html>
